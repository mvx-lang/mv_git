# Release mv_git on a version tag: publish the source package and prebuilt
# binaries (mvx + UniData) as GitHub release assets.  The package registry
# indexes them via its release webhook (it hosts nothing).  Each job publishes
# to the same release; asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_'):
#   source                        -> mv_git-<ver>-source.tar.gz
#   mvx binary  (linux/x86_64,le) -> mv_git-<ver>-mvx-linux-x86_64-le.tar.gz
#   udt binary  (linux/x86_64,le) -> mv_git-<ver>-udt-linux-x86_64-le.tar.gz
#   uv  binary  (linux/x86_64,le) -> mv_git-<ver>-uv-linux-x86_64-le.tar.gz
#
# git is native (libgit2).  The mvx binary is the compiled verbs plus the
# libgit2 extension library and the mvx-git CLI, built against a published mvx
# toolchain (setup-mvx ships the runtime headers + libmvxrt that build-native.sh
# needs via $MVXHOME).  The udt binary is udt-git, the record-git drop-in built
# in the udt-builder container.  Both are os/arch/endian-locked.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Tag the bare version to release, e.g.:  git tag 5.0 && git push origin 5.0
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ---- source package --------------------------------------------------------
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source package carries the tag's version too, so a tarball and a
      # binary release of the same tag never disagree about what they are.
      - name: Stamp the manifests with the tag
        run: . ./version.sh && mv_git_stamp_manifests . "${GITHUB_REF_NAME}"
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/git
          title: git
          body: "mv_git — git for hash-file records. Source + prebuilt mvx/udt binaries; indexed by the package registry."
          extra-exclude: docs        # the docs wiki submodule

  # ---- mvx binary: compiled verbs + libgit2 extension + mvx-git CLI -----------
  # Uses a published mvx toolchain (setup-mvx) — it ships the runtime headers +
  # libmvxrt, which build-native.sh finds via $MVXHOME.  No from-source build.
  mvx-binary:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out mv_git
        uses: actions/checkout@v5
        with:
          path: mv_git

      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          path: .mvx-src
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Set up the mvx toolchain (latest published build)
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      - name: Install libgit2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgit2-dev pkg-config

      - name: Build the mvx binary package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mv_git-$VER-mvx-$OS-$ARCH-$ENDIAN"

          cd mv_git
          # setup-mvx exported MVXHOME (headers + libmvxrt); build-native.sh uses
          # it, and mkpkg compiles the verbs with the installed mvx-basic.
          MVXBASIC="$(command -v mvx-basic)" \
            sh "$GITHUB_WORKSPACE/.mvx-src/scripts/mkpkg.sh" .
          test -f LIB/libgit.so
          test -x bin/mvx-git

          # Binary-only package: prebuilt libraries + CLI + verb records + the
          # bundled cmd fallback, no BASIC source.  Native -> os/arch-locked.
          DIST="dist/$BASE"; rm -rf "$DIST"; mkdir -p "$DIST"
          cp -a LIB bin PKG mvpkg.json LICENSE README.md "$DIST/"
          # The manifests carry the TAG, not whatever the tree happened to say:
          # 2.0.0 shipped declaring itself 2.0.0-rc5, so MVPKG would install the
          # stable release and report a release candidate.
          . ./version.sh && mv_git_stamp_manifests "$DIST" "$VER"
          # CATALOG carries the COMPILED VERBS, and was missing from this list:
          # VOC/GIT is a "V" record pointing at CATALOG/GIT, so the package
          # registered a verb whose executable it did not ship.  Every mvx
          # binary release so far — 1.5.0 through 2.0.0-beta4 — was 15 entries
          # with no CATALOG, and `GIT` from one could only ever answer
          # "mvx: cannot execute .../CATALOG/GIT".  The udt and uv packages
          # compile their verbs at install time, which is why only this one was
          # affected, and why nothing noticed.
          for d in VOC VOC.DICT CMD.BP CMD.BP.DICT CATALOG; do [ -e "$d" ] && cp -a "$d" "$DIST/" || true; done
          rm -rf "$DIST"/LIB/*.dSYM "$DIST"/LIB/*.debug
          rm -rf "$DIST"/CATALOG/*.dSYM "$DIST"/CATALOG/*.debug

          # EVERY VERB THE PACKAGE REGISTERS MUST BE IN THE PACKAGE.  This is the
          # check that would have caught the above: walk the V records and prove
          # each one's target exists, rather than trusting the copy list to stay
          # in step with what mkpkg produces.
          for v in "$DIST"/VOC/*; do
            [ -f "$v" ] || continue
            [ "$(head -1 "$v")" = "V" ] || continue
            tgt="$(sed -n 2p "$v")"
            [ -n "$tgt" ] || continue
            if [ ! -e "$DIST/$tgt" ]; then
              echo "package would ship VOC/$(basename "$v") pointing at missing $tgt" >&2
              exit 1
            fi
          done

          tar czf "$BASE.tar.gz" -C "$DIST" .   # contents at the tar root (no wrapping dir)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=mv_git/$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=mv_git/$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # A tag carrying a -beta/-rc suffix is a PRE-RELEASE, and GitHub has to
          # be told: 2.0.0-beta1 published as a full release, which is what
          # "latest" then points at and what anyone installing by name would get.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt binary: udt-git, the record-git drop-in for UniData ---------------
  # build-udt.sh (in the container) builds udt-git + the CallC objects and stages
  # the package; the shared udt-build action does image check / key / tar / publish.
  # libgit2 lives at the container default (/usr/local); the version is stamped
  # from GITHUB_REF_NAME, which udt-run forwards.
  udt-binary:
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/git
          # The FILE is mv_git; the package it installs as is not (mv_git#101).
          artifact: mv_git

  # ---- UniVerse binary -------------------------------------------------------
  # Same shape as udt, and on the same runner: both build inside their licensed
  # container on the general VM, so neither depends on a development machine
  # being in any particular state.  The uv build itself needs no UniVerse — only
  # the install does — but it is built in the container anyway so the binary is
  # linked against the platform it will run on rather than whatever the runner
  # happens to have.
  uv-binary:
    runs-on: [self-hosted, linux, uv]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/uv-build@main
        with:
          package: mvx-lang/git
          artifact: mv_git
