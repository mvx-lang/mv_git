# Release mv_git on a version tag: publish the source package and prebuilt
# binaries (mvx + UniData) as GitHub release assets.  The package registry
# indexes them via its release webhook (it hosts nothing).  Each job publishes
# to the same release; asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_'):
#   source                        -> mv_git-<ver>-source.tar.gz
#   mvx binary  (linux/x86_64,le) -> mv_git-<ver>-mvx-linux-x86_64-le.tar.gz
#   udt binary  (linux/x86_64,le) -> mv_git-<ver>-udt-linux-x86_64-le.tar.gz
#   uv  binary  (linux/x86_64,le) -> mv_git-<ver>-uv-linux-x86_64-le.tar.gz
#   jbase binary (linux/x86_64,le) -> mv_git-<ver>-jbase-linux-x86_64-le.tar.gz
#
# git is native (libgit2).  The mvx binary is the compiled verbs plus the
# libgit2 extension library and the mvx-git CLI, built against a published mvx
# toolchain (setup-mvx ships the runtime headers + libmvxrt that build-native.sh
# needs via $MVXHOME).  The udt binary is udt-git, the record-git drop-in built
# in the udt-builder container.  Both are os/arch/endian-locked.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Tag the bare version to release, e.g.:  git tag 5.0 && git push origin 5.0
#
# NOTHING here publishes unless `ci.yml` concluded success for the tagged
# commit, with a green job for every port.  See the ci-gate job (mv_git#159).
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"
      # ONE rolling dev tag, moved to develop's HEAD by the nightly when there
      # is something new and CI is green.  It builds through THIS workflow
      # rather than a second copy of it, so a dev build is the same artifacts by
      # the same steps as a release -- the only way a dev build is worth having.
      - "dev"

  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented --
  # so the nightly's tag lands and nothing happens.  It dispatches this workflow
  # on the tag instead, which is the same build from the same ref (mv_git#195).
  workflow_dispatch:

permissions:
  contents: write
  actions: read      # ci-gate reads the ci run for this commit

jobs:
  # ---- the gate: no green CI for this commit, no release ---------------------
  # Every publishing job below takes `needs: ci-gate`, so a red port publishes
  # nothing at all -- no source tarball, no binaries.  Before this existed the
  # release ran no tests whatsoever and a tag published unconditionally.
  #
  # `ci.yml` does not run on tag pushes, and it does not need to: the tag names
  # a commit that was pushed to main, and that push is the run this looks up by
  # head_sha.  If the tag was pushed seconds after the merge the run is still
  # going, so this waits for it rather than failing.
  ci-gate:
    name: CI must be green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require a green ci run for this commit, on every port
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          now() { date +%s; }
          api="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100"
          appear_by=$(( $(now) + 600 ))    # 10 min for the run to show up
          finish_by=$(( $(now) + 3600 ))   # 60 min for it to finish

          while :; do
            run="$(gh api "$api" --jq '.workflow_runs | sort_by(.run_started_at) | last // empty')"

            # AN ABSENT RUN IS A FAILURE, NOT A PASS.  A gate that concludes
            # "green" from finding nothing is not a gate.
            if [ -z "$run" ]; then
              if [ "$(now)" -ge "$appear_by" ]; then
                echo "::error::no ci run for $SHA. Release only a commit CI has run on: push it to main, let ci finish, then tag it."
                exit 1
              fi
              echo "no ci run for $SHA yet, waiting ..."; sleep 20; continue
            fi

            id="$(printf '%s' "$run" | jq -r .id)"
            url="$(printf '%s' "$run" | jq -r .html_url)"
            status="$(printf '%s' "$run" | jq -r .status)"

            if [ "$status" != completed ]; then
              if [ "$(now)" -ge "$finish_by" ]; then
                echo "::error::ci run $url is still '$status' after 60 minutes. Not releasing on an unfinished run."
                exit 1
              fi
              echo "ci run is '$status' ($url), waiting ..."; sleep 20; continue
            fi

            conclusion="$(printf '%s' "$run" | jq -r .conclusion)"
            if [ "$conclusion" != success ]; then
              echo "::error::ci concluded '$conclusion' for $SHA ($url). Nothing will be published."
              exit 1
            fi

            # A run whose per-port job was renamed, removed or never scheduled
            # still concludes 'success' overall.  A port that did not run is not
            # a port that passed, so name them and check each one.
            # no --paginate: with --jq that emits one array per page, and
            # `index` on the first would silently ignore the rest.
            jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                      --jq '[.jobs[] | select(.conclusion == "success") | .name]')"
            for port in mvx udt uv jbase; do
              printf '%s' "$jobs" | jq -e --arg p "$port" 'index($p)' >/dev/null || {
                echo "::error::ci run $url has no successful '$port' job."
                exit 1
              }
            done

            echo "ci is green for $SHA on every port (mvx, udt, uv, jbase): $url"
            break
          done

  # ---- source package --------------------------------------------------------
  source:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source package carries the tag's version too, so a tarball and a
      # binary release of the same tag never disagree about what they are.
      - name: Stamp the manifests with the tag
        run: . ./version.sh && mv_git_stamp_manifests . "${GITHUB_REF_NAME}"
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/git
          title: git
          body: "mv_git — git for hash-file records. Source + prebuilt mvx/udt binaries; indexed by the package registry."
          extra-exclude: docs        # the docs wiki submodule

  # ---- mvx binary: compiled verbs + libgit2 extension + mvx-git CLI -----------
  # Uses a published mvx toolchain (setup-mvx) — it ships the runtime headers +
  # libmvxrt, which build-native.sh finds via $MVXHOME.  No from-source build.
  # needs: [source] — NOT for ordering, but so this job never CREATES the release.
  # Every publish step creates it as a side effect of uploading, so jobs starting
  # together each try to create it: one wins and the losers fail finalize with
  # `Validation Failed: {"code":"already_exists","field":"tag_name"}`, leaving a
  # stray draft release behind for the tag.  That is where the duplicate draft
  # beside every tag comes from, and on mv_package#66 it went further — the job
  # it killed was `source`, which other jobs need, so the release shipped with
  # half its artifacts.  `source` alone creates it; the rest upload into it.
  mvx-binary:
    needs: [ci-gate, source]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out mv_git
        uses: actions/checkout@v5
        with:
          path: mv_git

      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          path: .mvx-src
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Set up the mvx toolchain (latest published build)
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      - name: Install libgit2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgit2-dev pkg-config

      - name: Build the mvx binary package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mv_git-$VER-mvx-$OS-$ARCH-$ENDIAN"

          cd mv_git
          # setup-mvx exported MVXHOME (headers + libmvxrt); build-native.sh uses
          # it, and mkpkg compiles the verbs with the installed mvx-basic.
          MVXBASIC="$(command -v mvx-basic)" \
            sh "$GITHUB_WORKSPACE/.mvx-src/scripts/mkpkg.sh" .
          test -f LIB/libgit.so
          test -x bin/mvx-git

          # Binary-only package: prebuilt libraries + CLI + verb records + the
          # bundled cmd fallback, no BASIC source.  Native -> os/arch-locked.
          DIST="dist/$BASE"; rm -rf "$DIST"; mkdir -p "$DIST"
          cp -a LIB bin PKG mvpkg.json LICENSE README.md "$DIST/"
          # The manifests carry the TAG, not whatever the tree happened to say:
          # 2.0.0 shipped declaring itself 2.0.0-rc5, so MVPKG would install the
          # stable release and report a release candidate.
          . ./version.sh && mv_git_stamp_manifests "$DIST" "$VER"
          # CATALOG carries the COMPILED VERBS, and was missing from this list:
          # VOC/GIT is a "V" record pointing at CATALOG/GIT, so the package
          # registered a verb whose executable it did not ship.  Every mvx
          # binary release so far — 1.5.0 through 2.0.0-beta4 — was 15 entries
          # with no CATALOG, and `GIT` from one could only ever answer
          # "mvx: cannot execute .../CATALOG/GIT".  The udt and uv packages
          # compile their verbs at install time, which is why only this one was
          # affected, and why nothing noticed.
          for d in VOC VOC.DICT CMD.BP CMD.BP.DICT CATALOG; do [ -e "$d" ] && cp -a "$d" "$DIST/" || true; done
          rm -rf "$DIST"/LIB/*.dSYM "$DIST"/LIB/*.debug
          rm -rf "$DIST"/CATALOG/*.dSYM "$DIST"/CATALOG/*.debug

          # EVERY VERB THE PACKAGE REGISTERS MUST BE IN THE PACKAGE.  This is the
          # check that would have caught the above: walk the V records and prove
          # each one's target exists, rather than trusting the copy list to stay
          # in step with what mkpkg produces.
          for v in "$DIST"/VOC/*; do
            [ -f "$v" ] || continue
            [ "$(head -1 "$v")" = "V" ] || continue
            tgt="$(sed -n 2p "$v")"
            [ -n "$tgt" ] || continue
            if [ ! -e "$DIST/$tgt" ]; then
              echo "package would ship VOC/$(basename "$v") pointing at missing $tgt" >&2
              exit 1
            fi
          done

          tar czf "$BASE.tar.gz" -C "$DIST" .   # contents at the tar root (no wrapping dir)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=mv_git/$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=mv_git/$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # A tag carrying a -beta/-rc suffix is a PRE-RELEASE, and GitHub has to
          # be told: 2.0.0-beta1 published as a full release, which is what
          # "latest" then points at and what anyone installing by name would get.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt binary: udt-git, the record-git drop-in for UniData ---------------
  # build-udt.sh (in the container) builds udt-git + the CallC objects and stages
  # the package; the shared udt-build action does image check / key / tar / publish.
  # libgit2 lives at the container default (/usr/local); the version is stamped
  # from GITHUB_REF_NAME, which udt-run forwards.
  udt-binary:
    needs: [ci-gate, source]
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/git
          # The FILE is mv_git; the package it installs as is not (mv_git#101).
          artifact: mv_git

  # ---- UniVerse binary -------------------------------------------------------
  # Same shape as udt, and on the same runner: both build inside their licensed
  # container on the general VM, so neither depends on a development machine
  # being in any particular state.  The uv build itself needs no UniVerse — only
  # the install does — but it is built in the container anyway so the binary is
  # linked against the platform it will run on rather than whatever the runner
  # happens to have.
  uv-binary:
    needs: [ci-gate, source]
    runs-on: [self-hosted, linux, uv]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/uv-build@main
        with:
          package: mvx-lang/git
          artifact: mv_git

  # ---- jBASE binary: jb-git, and the verb's DEFC library ---------------------
  # Built in the licensed container on the general VM, like udt and uv.  There is
  # no shared build action to call: udt's and uv's exist because their containers
  # are the same shape as each other, and this one is not -- it needs no account
  # to build, only a compiler and the jBASE headers.
  jbase-binary:
    needs: [ci-gate, source]
    runs-on: [self-hosted, linux, jbase]
    steps:
      - uses: actions/checkout@v5

      - name: Build the jBASE binary package
        id: pkg
        shell: bash
        run: |
          set -eu
          # In the container, like udt and uv -- see .github/jbase-run for why
          # this is not a machine with jBASE installed on it (mv_git#199).
          sh .github/jbase-run 'rm -rf dist && mkdir -p dist && sh build-jbase.sh /pkg/dist'

          DIST="$PWD/dist/mv_git"
          # FOUR-PART SUFFIX, like every other binary here.  The registry parses
          # an asset name as "<base>-<version>-<suffix>" and only treats the
          # suffix as a binary key when it splits into exactly
          # <system>-<os>-<arch>-<endian>; a bare "jbase" is two parts, so the
          # artifact was published, ignored by the indexer, and every jBASE
          # install silently resolved to the source tarball instead.
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mv_git-$VER-jbase-$OS-$ARCH-$ENDIAN"

          # WHAT THE PACKAGE PROMISES MUST BE IN IT.  jb-git is the CLI and
          # libjbgit.so is what the in-session verb reaches through DEFC; a
          # package missing either is one that installs and then cannot run.
          for f in jb-git libjbgit.so install.sh PLATFORM.H NOCOMPILE; do
            [ -e "$DIST/$f" ] || { echo "package has no $f" >&2; exit 1; }
          done
          [ "$(ls -1 "$DIST/BP" | wc -l)" -gt 0 ] || { echo "package has no BP" >&2; exit 1; }

          tar czf "$BASE.tar.gz" -C "$DIST" .
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the jBASE binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- what kind of release is this? -----------------------------------------
  # Every publish step above can CREATE the release, and they do not agree about
  # what it is: this workflow's own steps mark a suffixed tag as a pre-release,
  # while the shared udt/uv build actions do not set the field at all -- so
  # whichever ran first decided, and an unset field defaults to "full release".
  # A dev build promoted to "Latest" is what anyone installing by name would then
  # get.
  #
  # So say it once, at the end, when the assets are all there and there is
  # nothing left to race with.
  mark:
    needs: [source, mvx-binary, udt-binary, uv-binary, jbase-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # the whole history and every tag, to say what changed

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # EVERY ISSUE, UNDER THE SYSTEM IT WAS ON.  Four ports ship from one
          # tree, and "what changed" is a different answer for each: a UniVerse
          # site reading a list that is nine tenths jBASE has to work out which
          # nine tenths, every time.
          sh .github/release-notes.sh "$TAG" > /tmp/notes.md
          cat /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md

      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are, and a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          #
          # Both directions are set explicitly.  Leaving the stable case alone
          # would mean it kept whatever the first publish step happened to
          # decide, which is the thing this job exists to stop.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
