# Release mv_git on a version tag: publish the source package and prebuilt
# binaries (mvx + UniData) as GitHub release assets.  The package registry
# indexes them via its release webhook (it hosts nothing).  Each job publishes
# to the same release; asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_'):
#   source                        -> mvx-lang_git-<ver>-source.tar.gz
#   mvx binary  (linux/x86_64,le) -> mvx-lang_git-<ver>-mvx-linux-x86_64-le.tar.gz
#   udt binary  (linux/x86_64,le) -> mvx-lang_git-<ver>-udt-linux-x86_64-le.tar.gz
#
# git is native (libgit2).  The mvx binary is the compiled verbs plus the
# libgit2 extension library and the mvx-git CLI, built against a published mvx
# toolchain (setup-mvx ships the runtime headers + libmvxrt that build-native.sh
# needs via $MVXHOME).  The udt binary is udt-git, the record-git drop-in built
# in the udt-builder container.  Both are os/arch/endian-locked.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Tag the bare version to release, e.g.:  git tag 5.0 && git push origin 5.0
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ---- source package --------------------------------------------------------
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/git
          title: git
          body: "mv_git — git for hash-file records. Source + prebuilt mvx/udt binaries; indexed by the package registry."
          extra-exclude: docs        # the docs wiki submodule

  # ---- mvx binary: compiled verbs + libgit2 extension + mvx-git CLI -----------
  # Uses a published mvx toolchain (setup-mvx) — it ships the runtime headers +
  # libmvxrt, which build-native.sh finds via $MVXHOME.  No from-source build.
  mvx-binary:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out mv_git
        uses: actions/checkout@v5
        with:
          path: mv_git

      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          path: .mvx-src
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Set up the mvx toolchain (latest published build)
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      - name: Install libgit2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgit2-dev pkg-config

      - name: Build the mvx binary package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"; OS="linux"
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mvx-lang_git-$VER-mvx-$OS-$ARCH-$ENDIAN"

          cd mv_git
          # setup-mvx exported MVXHOME (headers + libmvxrt); build-native.sh uses
          # it, and mkpkg compiles the verbs with the installed mvx-basic.
          MVXBASIC="$(command -v mvx-basic)" \
            sh "$GITHUB_WORKSPACE/.mvx-src/scripts/mkpkg.sh" .
          test -f LIB/libgit.so
          test -x bin/mvx-git

          # Binary-only package: prebuilt libraries + CLI + verb records + the
          # bundled cmd fallback, no BASIC source.  Native -> os/arch-locked.
          DIST="dist/$BASE"; rm -rf "$DIST"; mkdir -p "$DIST"
          cp -a LIB bin PKG mvpkg.json LICENSE README.md "$DIST/"
          for d in VOC VOC.DICT CMD.BP CMD.BP.DICT; do [ -e "$d" ] && cp -a "$d" "$DIST/" || true; done
          rm -rf "$DIST"/LIB/*.dSYM "$DIST"/LIB/*.debug
          tar czf "$BASE.tar.gz" -C "$DIST" .   # contents at the tar root (no wrapping dir)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=mv_git/$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=mv_git/$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt binary: udt-git, the record-git drop-in for UniData ---------------
  udt-binary:
    runs-on: [self-hosted, linux, udt]
    steps:
      - name: Check out mv_git
        uses: actions/checkout@v5

      - name: Build udt-git in the udt-builder container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${UDT_BUILDER_IMAGE:-udt-builder:8.3.2}"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::udt-builder image '$IMAGE' not on this runner (see mv-package-registry/builder/README.md)." >&2
            exit 1
          fi
          docker run --rm --hostname unidata \
            -e LIBGIT2_PREFIX=/usr/local -e UDTGIT_VERSION="${GITHUB_REF_NAME}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/pkg -w /pkg \
            "$IMAGE" bash -lc 'sh build-udt.sh && chown "$HOST_UID:$HOST_GID" udt-git'
          test -x ./udt-git

      - name: Package the udt binary
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          OS="$(uname -s | tr 'A-Z' 'a-z')"; case "$OS" in *linux*) OS=linux ;; esac
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mvx-lang_git-$VER-udt-$OS-$ARCH-$ENDIAN"
          D="dist/$BASE"
          mkdir -p "$D/BP" "$D/udt-callc"
          # A proper MVPKG package (contents at the tar root, no wrapping dir):
          #   BP/GIT       the in-session verb source — CATGLOBAL compiles + globally
          #                catalogs it (after CALLC registers its functions), then
          #                deploy.verbs:[GIT] points the account's VOC at it.
          #   udt-callc/   the CallC objects + funcs/libs — CALLC aggregates them
          #                into libu2callc.so so GITINIT/GITSTAGE/... resolve.
          #   mvpkg.json   the manifest (its deploy block drives the verb deploy).
          # GIT.udt.b + udt-git are also kept at the root for a manual/standalone
          # install (udt-git finds GIT.udt.b beside itself; see INSTALL.txt).
          cp udt/GIT.udt.b "$D/BP/GIT"
          cp udt/GIT.udt.b "$D/GIT.udt.b"
          cp udt-git "$D/"
          cp mvpkg.json PKG LICENSE README.md "$D/" 2>/dev/null || true
          cp udt-callc/*.o udt-callc/funcs udt-callc/libs "$D/udt-callc/" 2>/dev/null || true
          cat > "$D/INSTALL.txt" <<EOF
          mv_git for Rocket UniData ($OS/$ARCH, $ENDIAN).

          The easy path is 'MVPKG install mvx-lang/git' — it builds the CallC
          library (from udt-callc/), globally catalogs the in-session GIT verb
          (BP/GIT), and deploys it into the account (mvpkg.json deploy.verbs).

          Manual/standalone install:
            1. Copy udt-git AND GIT.udt.b together onto the host PATH
               (e.g. both into \$UDTHOME/bin) — udt-git finds GIT.udt.b beside
               itself (or via \$MVGIT_VERB / \$UDTHOME/lib/mvgit/GIT.udt.b).
            2. Ensure libgit2 1.9.x is present at runtime (/usr/local/lib64).
          'udt-git init'/'clone' then set up the in-session GIT verb in the
          account (needs the CallC library built).

          If you installed standalone and later add MVPKG, run 'udt-git register'
          (or any 'udt-git init') so git registers itself with MVPKG — it is then
          managed like an MVPKG-installed package (MVPKG list / update).

          Run:  udt-git -a <account> <clone|status|...>  |  GIT <status|...>
          Session env: UDT_HOST / UDT_USER / UDT_PASSWORD / UDT_SERVICE.
          EOF
          TARBALL="$BASE.tar.gz"
          tar czf "$TARBALL" -C "$D" .   # contents at the tar root (no wrapping dir)
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "checksum=$TARBALL.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the udt binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true
