# Release the UniData build of mv_git (udt-git) on a version tag.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# udt-git is a standalone host binary (the record-git drop-in for UniData
# accounts), compiled by build-udt.sh against libgit2 + UniData InterCall.  It
# builds only on a licensed UniData install, so this runs in the udt-builder
# container on the self-hosted RedHat/Rocky runner (label `udt`).
#
# The build produces a GitHub *release asset* only — the package registry picks
# the release up via its GitHub release webhook and indexes the asset (it hosts
# no bytes).  So there is nothing registry-specific here.
#
# Tag the bare version to release, e.g.:  git tag 5.0 && git push origin 5.0
name: release udt-git

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"        # bare version tags: 5.0, 5.1, ...

permissions:
  contents: write              # create the GitHub release + upload the asset

jobs:
  build:
    runs-on: [self-hosted, linux, udt]
    steps:
      - name: Check out mv_git
        uses: actions/checkout@v4

      - name: Build udt-git in the udt-builder container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${UDT_BUILDER_IMAGE:-udt-builder:8.3.2}"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::udt-builder image '$IMAGE' not on this runner (see mv-package-registry/builder/README.md)." >&2
            exit 1
          fi
          # build-udt.sh needs UDTHOME (set by the image), libgit2 (.so + headers,
          # captured into the image) and UniData InterCall (in $UDTHOME).  It
          # writes ./udt-git; chown it back to the runner user so later checkouts
          # can clean it (the container runs as root).
          docker run --rm --hostname unidata \
            -e LIBGIT2_PREFIX=/usr/local \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/pkg -w /pkg \
            "$IMAGE" bash -lc './build-udt.sh && chown "$HOST_UID:$HOST_GID" udt-git'
          test -x ./udt-git

      - name: Package the release tarball
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          OS="$(uname -s | tr 'A-Z' 'a-z')"; case "$OS" in *linux*) OS=linux ;; esac
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          # Artifact name mirrors the registry's binary key so the release
          # webhook can map it: <name>-<ver>-<system>-<os>-<arch>-<endian>.
          BASE="mv-lang_git-$VER-udt-$OS-$ARCH-$ENDIAN"
          mkdir -p "dist/$BASE"
          cp udt-git "dist/$BASE/"
          cp udt/GIT.udt.b "dist/$BASE/" 2>/dev/null || true
          cp LICENSE README.md "dist/$BASE/" 2>/dev/null || true
          cat > "dist/$BASE/INSTALL.txt" <<EOF
          udt-git — the record-git binary for Rocket UniData ($OS/$ARCH, $ENDIAN).

          Install:
            1. Copy udt-git onto the host PATH (e.g. \$UDTHOME/bin).
            2. Ensure libgit2 1.9.x is present at runtime (/usr/local/lib64).
            3. Optionally catalog GIT.udt.b as the in-session GIT verb.

          Run:  udt-git -a <account> <clone|status|...>
          Session env: UDT_HOST / UDT_USER / UDT_PASSWORD / UDT_SERVICE.
          EOF
          TARBALL="$BASE.tar.gz"
          tar czf "$TARBALL" -C dist "$BASE"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "checksum=$TARBALL.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: udt-git ${{ github.ref_name }}
          body: |
            UniData build of mv_git (`udt-git`) for this runner's system/arch.
            The package registry indexes this asset via its release webhook.
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true
